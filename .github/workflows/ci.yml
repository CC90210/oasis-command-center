name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # `npm ci` cannot install this project on Linux.
      #
      # package-lock.json is generated on Windows, and npm records optional
      # platform-specific dependencies only for the host platform. Linux
      # resolves a different `sharp` variant, which pulls
      # @emnapi/runtime@1.11.3 — an entry a Windows-generated lockfile does
      # not contain. `npm ci` treats that as a lockfile/manifest mismatch
      # and aborts, so EVERY run since 2026-08-01 died at the install step
      # before reaching typecheck, lint, tests or build.
      #
      # That is worse than it sounds: the pipeline was red continuously, so
      # nothing it was supposed to guard was actually being guarded, and a
      # test added to it changed nothing. A CI that cannot install is not a
      # weaker gate, it is no gate.
      #
      # `npm install` resolves per-platform on the runner and installs
      # correctly. It trades strict lockfile determinism for a pipeline that
      # runs at all, which is the right trade while the lockfile cannot be
      # regenerated on Linux. Proper fix when someone has a Linux shell:
      # regenerate package-lock.json there and restore `npm ci`.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - name: Tests
        # Pure-logic suites (tsx) — guard security-critical behavior (role gates,
        # public-route prefixes, cross-tenant scoping, lifecycle, form PDF,
        # streamed-secret redaction). A green build with a broken role gate or a
        # leaking redactor must NOT auto-deploy via Vercel.
        # NOTE: test:chat-modes is still excluded — its assertions pass but the
        # process exits 1 on a transitive server-only import under tsx (harness
        # issue, not a product bug); re-add once that import chain is decoupled.
        run: |
          npm run test:sunbiz
          npm run test:event-bus
          npm run test:streaming-redactor
          npm run test:marketing
      - name: Build
        env:
          # Minimal env so the build doesn't blow up on missing required vars.
          # Real values come from Vercel in production deploys.
          BRAVO_SUPABASE_URL: https://placeholder.supabase.co
          BRAVO_SUPABASE_SERVICE_ROLE_KEY: placeholder
          BRAVO_SUPABASE_ANON_KEY: placeholder
        run: npm run build
