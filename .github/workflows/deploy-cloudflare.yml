# Deploy to Cloudflare Workers — GENERATED by
# Business-Empire-Agent `scripts/integrations/wrangler_tool.py workflow --app oasis-command-center`.
# Regenerate rather than hand-editing (the build env is derived from the app's
# secret manifest, which is the single source of truth for key NAMES).
#
# WHAT THIS DOES: every push to main builds the Worker with @opennextjs/cloudflare and deploys it.
# WHAT IT DOES NOT DO: push Worker SECRETS. Those stay operator-managed from the
# agents env store (`wrangler_tool.py secrets-push --app oasis-command-center`) — a deploy does
# not clear a Worker's existing secrets, so CI never needs them at runtime.
#
# REQUIRED REPO SECRETS (CC adds these in Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN   — Workers Scripts:Edit on the deploying account
#   CLOUDFLARE_ACCOUNT_ID  — e371c0f2dfde76e329b351a54bc738fe
#   -- every manifest key: the build needs runtime secrets too,
#      because module-scope SDK init runs during page-data collection
#   ACCELERATED_ENROLL_LIVE
#   ANTHROPIC_API_KEY
#   APEX_PG_BRIDGE_TOKEN
#   APP_SECRET
#   AUTH_SESSION_SECRET
#   BRAVO_FIELD_ENCRYPTION_KEY
#   BRAVO_FORCE_DRY_RUN
#   CHAT_RESUME_HMAC_KEY
#   CLOUDFLARE_ACCOUNT_ID
#   CONVERSATIONS_SPINE
#   CRON_ALLOW_LOCAL
#   DRIPS_EMAIL_DAILY_CAP_BLUERISE
#   DRIPS_EMAIL_DAILY_CAP_SUNBIZ
#   DRIPS_EMAIL_HOURLY_CAP_BLUERISE
#   DRIPS_ENROLL_DAILY_CAP
#   DRIPS_ENROLL_LIMIT
#   DRIPS_ENROLL_STAGES
#   DRIPS_LIVE
#   DRIPS_OPTOUT_COOLOFF_DAYS
#   DRIPS_SMS_DAILY_CAP
#   DRIPS_SMS_HOURLY_CAP
#   DRIPS_SMS_VERIFIED_ONLY
#   DRIPS_SMS_WINDOW_START_UTC
#   DRIP_AI_WIRE_STAGES
#   DRIP_HANDOFF_EMAILS
#   DRIP_SMS_ONLY_STAGES
#   EMPIRE_AUTH_BACKEND
#   EMPIRE_DATA_BACKEND
#   ESIGN_FROM_APP_PASSWORD
#   ESIGN_FROM_EMAIL
#   ESIGN_FROM_NAME
#   FORM_LINK_HMAC_KEY
#   FOUNDERS_TENANT_IDS
#   GOOGLE_SYSTEM_CALENDAR_CLIENT_ID
#   GOOGLE_SYSTEM_CALENDAR_CLIENT_SECRET
#   KIXIE_API_KEY
#   KIXIE_BUSINESS_ID
#   KIXIE_WEBHOOK_SECRET
#   LEAD_SCOPING_ENABLED
#   LEAD_SCOPING_MODE
#   LIVE_SEND_CONSTANT_CONTACT
#   LIVE_SEND_KIXIE
#   LIVE_SEND_TEXTTORRENT
#   N8N_INGEST_SECRET
#   NEXT_PUBLIC_OPTINVAULT_DISCLOSURE_BLUERISE  (inlined into the client bundle)
#   NEXT_PUBLIC_OPTINVAULT_DISCLOSURE_SUNBIZ  (inlined into the client bundle)
#   NEXT_PUBLIC_OPTINVAULT_SITE_KEY_BLUERISE  (inlined into the client bundle)
#   NEXT_PUBLIC_OPTINVAULT_SITE_KEY_SUNBIZ  (inlined into the client bundle)
#   NEXT_PUBLIC_OPTINVAULT_URL  (inlined into the client bundle)
#   OASIS_TELEGRAM_BOT_TOKEN
#   OASIS_TELEGRAM_CHAT_ID
#   OASIS_TURSO_AUTH_TOKEN
#   OASIS_TURSO_DATABASE_URL
#   R2_ACCESS_KEY_ID
#   R2_BUCKET
#   R2_PUBLIC_BASE_URL
#   R2_SECRET_ACCESS_KEY
#   SCAN_TRIGGER_SECRET
#   SUNBIZ_OPS_TELEGRAM_BOT_TOKEN
#   SUNBIZ_OPS_TELEGRAM_CHAT_ID
#   SUNBIZ_OPS_TELEGRAM_FALLBACK_CHAT_ID
#   SUNBIZ_PUBLIC_FORM_ORIGIN
#   TEXTTORRENT_ACT_AS_EMAIL
#   TEXTTORRENT_API_SID
#   TEXTTORRENT_FOLLOWUP_ACT_AS_EMAIL
#   TEXTTORRENT_FOLLOWUP_API_SID
#   TEXTTORRENT_FOLLOWUP_PUBLIC_KEY
#   TEXTTORRENT_FROM_NUMBER
#   TEXTTORRENT_PUBLIC_KEY
#   TEXTTORRENT_TENANT_ID
#   TPS_AUTO_ENROLL_SINCE
#   TURSO_AUTH_TOKEN
#   TURSO_DATABASE_URL
#   api_key_Constant_Contact
#   BOOKING_LINK
#   BRAVO_ANTHROPIC_API_KEY
#   BRAVO_SUPABASE_SERVICE_ROLE_KEY
#   BRAVO_SUPABASE_URL
#   BRIDGE_BEARER_TOKEN
#   BRIDGE_BEARER_TOKEN_OASIS_AI_CC
#   BRIDGE_VPS_URL
#   CLI_SIGNUP_SECRET
#   CRON_SECRET
#   FUNMATE_APP_PASSWORD
#   FUNMATE_EMAIL
#   GMAIL_APP_PASSWORD
#   GMAIL_USER
#   GOOGLE_CALENDAR_ID
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
#   GOOGLE_SYSTEM_CALENDAR_ADDRESS
#   GOOGLE_SYSTEM_CALENDAR_REFRESH_TOKEN
#   NEXT_PUBLIC_BOOKING_URL  (inlined into the client bundle)
#   NEXT_PUBLIC_BRIDGE_CHAT_BASE  (inlined into the client bundle)
#   NEXT_PUBLIC_SUPABASE_ANON_KEY  (inlined into the client bundle)
#   NEXT_PUBLIC_SUPABASE_URL  (inlined into the client bundle)
#   OASIS_OUTBOUND_HMAC_SECRET
#   OPERATOR_EMAIL
#   PUBLIC_APP_URL
#   TT_PG_BRIDGE_TOKEN
#
# Until CLOUDFLARE_API_TOKEN exists the job still BUILDS (real signal on build
# breakage) and SKIPS the deploy with a warning — no red CI while the migration
# waits on operator gates.
name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cf-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # NOTE: the deploy step below is gated on this step's OUTPUT, not on
      # `if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}`. GitHub does not expose
      # the `secrets` context to `if:` at job OR step level (docs, Context
      # availability: step-level `if` gets github/needs/strategy/matrix/job/
      # runner/env/vars/steps/inputs only). Written that way the condition never
      # sees the token, evaluates false, and the deploy SILENTLY never runs.
      # Reading the secret into `env` here is the supported workaround.
      - name: Preflight - is the Cloudflare token configured?
        id: preflight
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            # notice, not warning: an un-provisioned repo is an expected state
            # during the migration and must not decorate every run with a
            # yellow annotation operators learn to ignore.
            echo "::notice::CLOUDFLARE_API_TOKEN not set - build-only run, deploy skipped."
          fi

      - name: Build (OpenNext -> Cloudflare Worker)
        run: npx opennextjs-cloudflare build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          CF_MIGRATION_BUILD: "1"
          ACCELERATED_ENROLL_LIVE: ${{ secrets.ACCELERATED_ENROLL_LIVE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APEX_PG_BRIDGE_TOKEN: ${{ secrets.APEX_PG_BRIDGE_TOKEN }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
          BRAVO_FIELD_ENCRYPTION_KEY: ${{ secrets.BRAVO_FIELD_ENCRYPTION_KEY }}
          BRAVO_FORCE_DRY_RUN: ${{ secrets.BRAVO_FORCE_DRY_RUN }}
          CHAT_RESUME_HMAC_KEY: ${{ secrets.CHAT_RESUME_HMAC_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONVERSATIONS_SPINE: ${{ secrets.CONVERSATIONS_SPINE }}
          CRON_ALLOW_LOCAL: ${{ secrets.CRON_ALLOW_LOCAL }}
          DRIPS_EMAIL_DAILY_CAP_BLUERISE: ${{ secrets.DRIPS_EMAIL_DAILY_CAP_BLUERISE }}
          DRIPS_EMAIL_DAILY_CAP_SUNBIZ: ${{ secrets.DRIPS_EMAIL_DAILY_CAP_SUNBIZ }}
          DRIPS_EMAIL_HOURLY_CAP_BLUERISE: ${{ secrets.DRIPS_EMAIL_HOURLY_CAP_BLUERISE }}
          DRIPS_ENROLL_DAILY_CAP: ${{ secrets.DRIPS_ENROLL_DAILY_CAP }}
          DRIPS_ENROLL_LIMIT: ${{ secrets.DRIPS_ENROLL_LIMIT }}
          DRIPS_ENROLL_STAGES: ${{ secrets.DRIPS_ENROLL_STAGES }}
          DRIPS_LIVE: ${{ secrets.DRIPS_LIVE }}
          DRIPS_OPTOUT_COOLOFF_DAYS: ${{ secrets.DRIPS_OPTOUT_COOLOFF_DAYS }}
          DRIPS_SMS_DAILY_CAP: ${{ secrets.DRIPS_SMS_DAILY_CAP }}
          DRIPS_SMS_HOURLY_CAP: ${{ secrets.DRIPS_SMS_HOURLY_CAP }}
          DRIPS_SMS_VERIFIED_ONLY: ${{ secrets.DRIPS_SMS_VERIFIED_ONLY }}
          DRIPS_SMS_WINDOW_START_UTC: ${{ secrets.DRIPS_SMS_WINDOW_START_UTC }}
          DRIP_AI_WIRE_STAGES: ${{ secrets.DRIP_AI_WIRE_STAGES }}
          DRIP_HANDOFF_EMAILS: ${{ secrets.DRIP_HANDOFF_EMAILS }}
          DRIP_SMS_ONLY_STAGES: ${{ secrets.DRIP_SMS_ONLY_STAGES }}
          EMPIRE_AUTH_BACKEND: ${{ secrets.EMPIRE_AUTH_BACKEND }}
          EMPIRE_DATA_BACKEND: ${{ secrets.EMPIRE_DATA_BACKEND }}
          ESIGN_FROM_APP_PASSWORD: ${{ secrets.ESIGN_FROM_APP_PASSWORD }}
          ESIGN_FROM_EMAIL: ${{ secrets.ESIGN_FROM_EMAIL }}
          ESIGN_FROM_NAME: ${{ secrets.ESIGN_FROM_NAME }}
          FORM_LINK_HMAC_KEY: ${{ secrets.FORM_LINK_HMAC_KEY }}
          FOUNDERS_TENANT_IDS: ${{ secrets.FOUNDERS_TENANT_IDS }}
          GOOGLE_SYSTEM_CALENDAR_CLIENT_ID: ${{ secrets.GOOGLE_SYSTEM_CALENDAR_CLIENT_ID }}
          GOOGLE_SYSTEM_CALENDAR_CLIENT_SECRET: ${{ secrets.GOOGLE_SYSTEM_CALENDAR_CLIENT_SECRET }}
          KIXIE_API_KEY: ${{ secrets.KIXIE_API_KEY }}
          KIXIE_BUSINESS_ID: ${{ secrets.KIXIE_BUSINESS_ID }}
          KIXIE_WEBHOOK_SECRET: ${{ secrets.KIXIE_WEBHOOK_SECRET }}
          LEAD_SCOPING_ENABLED: ${{ secrets.LEAD_SCOPING_ENABLED }}
          LEAD_SCOPING_MODE: ${{ secrets.LEAD_SCOPING_MODE }}
          LIVE_SEND_CONSTANT_CONTACT: ${{ secrets.LIVE_SEND_CONSTANT_CONTACT }}
          LIVE_SEND_KIXIE: ${{ secrets.LIVE_SEND_KIXIE }}
          LIVE_SEND_TEXTTORRENT: ${{ secrets.LIVE_SEND_TEXTTORRENT }}
          N8N_INGEST_SECRET: ${{ secrets.N8N_INGEST_SECRET }}
          NEXT_PUBLIC_OPTINVAULT_DISCLOSURE_BLUERISE: ${{ secrets.NEXT_PUBLIC_OPTINVAULT_DISCLOSURE_BLUERISE }}
          NEXT_PUBLIC_OPTINVAULT_DISCLOSURE_SUNBIZ: ${{ secrets.NEXT_PUBLIC_OPTINVAULT_DISCLOSURE_SUNBIZ }}
          NEXT_PUBLIC_OPTINVAULT_SITE_KEY_BLUERISE: ${{ secrets.NEXT_PUBLIC_OPTINVAULT_SITE_KEY_BLUERISE }}
          NEXT_PUBLIC_OPTINVAULT_SITE_KEY_SUNBIZ: ${{ secrets.NEXT_PUBLIC_OPTINVAULT_SITE_KEY_SUNBIZ }}
          NEXT_PUBLIC_OPTINVAULT_URL: ${{ secrets.NEXT_PUBLIC_OPTINVAULT_URL }}
          OASIS_TELEGRAM_BOT_TOKEN: ${{ secrets.OASIS_TELEGRAM_BOT_TOKEN }}
          OASIS_TELEGRAM_CHAT_ID: ${{ secrets.OASIS_TELEGRAM_CHAT_ID }}
          OASIS_TURSO_AUTH_TOKEN: ${{ secrets.OASIS_TURSO_AUTH_TOKEN }}
          OASIS_TURSO_DATABASE_URL: ${{ secrets.OASIS_TURSO_DATABASE_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SCAN_TRIGGER_SECRET: ${{ secrets.SCAN_TRIGGER_SECRET }}
          SUNBIZ_OPS_TELEGRAM_BOT_TOKEN: ${{ secrets.SUNBIZ_OPS_TELEGRAM_BOT_TOKEN }}
          SUNBIZ_OPS_TELEGRAM_CHAT_ID: ${{ secrets.SUNBIZ_OPS_TELEGRAM_CHAT_ID }}
          SUNBIZ_OPS_TELEGRAM_FALLBACK_CHAT_ID: ${{ secrets.SUNBIZ_OPS_TELEGRAM_FALLBACK_CHAT_ID }}
          SUNBIZ_PUBLIC_FORM_ORIGIN: ${{ secrets.SUNBIZ_PUBLIC_FORM_ORIGIN }}
          TEXTTORRENT_ACT_AS_EMAIL: ${{ secrets.TEXTTORRENT_ACT_AS_EMAIL }}
          TEXTTORRENT_API_SID: ${{ secrets.TEXTTORRENT_API_SID }}
          TEXTTORRENT_FOLLOWUP_ACT_AS_EMAIL: ${{ secrets.TEXTTORRENT_FOLLOWUP_ACT_AS_EMAIL }}
          TEXTTORRENT_FOLLOWUP_API_SID: ${{ secrets.TEXTTORRENT_FOLLOWUP_API_SID }}
          TEXTTORRENT_FOLLOWUP_PUBLIC_KEY: ${{ secrets.TEXTTORRENT_FOLLOWUP_PUBLIC_KEY }}
          TEXTTORRENT_FROM_NUMBER: ${{ secrets.TEXTTORRENT_FROM_NUMBER }}
          TEXTTORRENT_PUBLIC_KEY: ${{ secrets.TEXTTORRENT_PUBLIC_KEY }}
          TEXTTORRENT_TENANT_ID: ${{ secrets.TEXTTORRENT_TENANT_ID }}
          TPS_AUTO_ENROLL_SINCE: ${{ secrets.TPS_AUTO_ENROLL_SINCE }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          api_key_Constant_Contact: ${{ secrets.api_key_Constant_Contact }}
          BOOKING_LINK: ${{ secrets.BOOKING_LINK }}
          BRAVO_ANTHROPIC_API_KEY: ${{ secrets.BRAVO_ANTHROPIC_API_KEY }}
          BRAVO_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BRAVO_SUPABASE_SERVICE_ROLE_KEY }}
          BRAVO_SUPABASE_URL: ${{ secrets.BRAVO_SUPABASE_URL }}
          BRIDGE_BEARER_TOKEN: ${{ secrets.BRIDGE_BEARER_TOKEN }}
          BRIDGE_BEARER_TOKEN_OASIS_AI_CC: ${{ secrets.BRIDGE_BEARER_TOKEN_OASIS_AI_CC }}
          BRIDGE_VPS_URL: ${{ secrets.BRIDGE_VPS_URL }}
          CLI_SIGNUP_SECRET: ${{ secrets.CLI_SIGNUP_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FUNMATE_APP_PASSWORD: ${{ secrets.FUNMATE_APP_PASSWORD }}
          FUNMATE_EMAIL: ${{ secrets.FUNMATE_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_SYSTEM_CALENDAR_ADDRESS: ${{ secrets.GOOGLE_SYSTEM_CALENDAR_ADDRESS }}
          GOOGLE_SYSTEM_CALENDAR_REFRESH_TOKEN: ${{ secrets.GOOGLE_SYSTEM_CALENDAR_REFRESH_TOKEN }}
          NEXT_PUBLIC_BOOKING_URL: ${{ secrets.NEXT_PUBLIC_BOOKING_URL }}
          NEXT_PUBLIC_BRIDGE_CHAT_BASE: ${{ secrets.NEXT_PUBLIC_BRIDGE_CHAT_BASE }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          OASIS_OUTBOUND_HMAC_SECRET: ${{ secrets.OASIS_OUTBOUND_HMAC_SECRET }}
          OPERATOR_EMAIL: ${{ secrets.OPERATOR_EMAIL }}
          PUBLIC_APP_URL: ${{ secrets.PUBLIC_APP_URL }}
          TT_PG_BRIDGE_TOKEN: ${{ secrets.TT_PG_BRIDGE_TOKEN }}

      - name: Deploy to Cloudflare Workers
        if: steps.preflight.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
