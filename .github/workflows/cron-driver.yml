# Drives the Vercel cron routes from GitHub Actions.
#
# WHY THIS EXISTS. Vercel's own scheduler stopped executing for this project on
# 2026-08-06. Everything that could explain it was checked and ruled out: the
# crons are registered in the deployment, enabled with disabledAt null, pinned
# to the CURRENT production deployment, CRON_SECRET is present on production,
# the routes are reachable and correctly reject unauthenticated callers, there
# is no deployment protection, and the team is on an active Pro plan with no
# billing block. The engine itself is fine — driven by hand it claimed and
# processed 12 rows in 3 seconds.
#
# So the fault is the scheduler alone, and this replaces it. CRON_ALLOW_LOCAL=1
# is set on production, which lets an external caller holding the bearer through
# the same auth the platform uses.
#
# The cost of the outage: the dispatcher had not claimed a row in four days and
# 230 steps sat overdue while everything reported healthy.
#
# CAVEAT: GitHub's scheduler is best-effort and can lag under load, so treat
# these as "at least every N minutes". That is the same guarantee Vercel gave,
# and considerably better than the zero we have now.

name: cron-driver

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  # Never overlap ticks. The dispatcher leases the rows it claims so a double
  # run is survivable, but overlapping ticks waste the shared TextTorrent rate
  # budget and make the logs hard to read.
  group: cron-driver
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Drive the due cron routes
        env:
          BASE: https://agent-dashboard-cc90210.vercel.app
          SECRET: ${{ secrets.OASIS_CRON_SECRET }}
        run: |
          set -uo pipefail
          if [ -z "${SECRET}" ]; then
            echo "::error::OASIS_CRON_SECRET is not set; refusing to run blind"
            exit 1
          fi

          # 2026-08-11: this drove 4 of the 22 routes registered in vercel.json.
          # The other 18 had been dead since Vercel's scheduler stopped on
          # 2026-08-06 and nobody noticed, because a cron that never runs
          # produces no error — it produces nothing at all. Among the missing
          # were scan-bounces and scan-funmate-replies, i.e. the reply side of
          # shopping out. tests/cron-driver-coverage.test.ts now fails when a
          # registered route has no entry here, so this cannot silently drift
          # again.

          # Each bucket below mirrors a registered schedule in vercel.json,
          # INCLUDING its query string. A first pass here bucketed routes by
          # rough cadence and dropped the ?mode=weekly Kixie variant entirely,
          # moved materialize-plans from 03:00 to 13:00, and demoted
          # tps-backlog-watch from 6-hourly to daily — a "replacement" scheduler
          # that quietly ran different work. The coverage test now compares full
          # paths with query strings, so a dropped variant fails CI.
          #
          # This job ticks every 5 minutes, so a schedule's minute is matched as
          # the 5-minute window containing it (e.g. "17 * * * *" fires in the
          # 15-19 window).

          # */5 — the paths that move mail and calls.
          FAST="/api/cron/dispatch-drips
                /api/cron/dispatch-scheduled-sends
                /api/cron/dispatch-scheduled-calls"

          # */10
          Q10="/api/cron/operator-email-agent?write=1
               /api/cron/tps-enroll?write=1"

          # */15 — enrolment feeds the dispatcher, reconcile-sms closes carrier
          # receipts, health-check is the outcome watchdog that now covers
          # shopping out too.
          Q15="/api/cron/enroll-drips
               /api/cron/enroll-accelerated
               /api/cron/reconcile-sms
               /api/cron/health-check"

          # */30 — inbound scanning. These read the mailboxes carrying lender
          # replies and bounces; without them an approval sits unread, which is
          # what happened for six days in August.
          Q30="/api/cron/scan-bounces?write=1
               /api/cron/scan-funmate-replies?write=1
               /api/cron/sync-tt-inbox"

          MIN=$(date -u +%M)
          HOUR=$(date -u +%H)
          DOW=$(date -u +%u)   # 1 = Monday
          M=$((10#${MIN})); H=$((10#${HOUR}))

          ROUTES="${FAST}"
          [ $((M % 10)) -lt 5 ] && ROUTES="${ROUTES} ${Q10}"
          [ $((M % 15)) -lt 5 ] && ROUTES="${ROUTES} ${Q15}"
          [ $((M % 30)) -lt 5 ] && ROUTES="${ROUTES} ${Q30}"

          # Hourly, at their registered minutes.
          [ "${M}" -lt 5 ]                        && ROUTES="${ROUTES} /api/cron/collect-outreach-intel?write=1"
          [ "${M}" -ge 15 ] && [ "${M}" -lt 20 ]  && ROUTES="${ROUTES} /api/cron/collect-cc-metrics?write=1 /api/cron/reconcile-drip-telemetry"

          if [ "${M}" -lt 5 ]; then
            # 0 */6 * * *
            [ $((H % 6)) -eq 0 ]                    && ROUTES="${ROUTES} /api/cron/tps-backlog-watch"
            # 0 3 * * *
            [ "${H}" -eq 3 ]                        && ROUTES="${ROUTES} /api/cron/materialize-plans"
            # 0 6,18 * * *  — reconciles the TextTorrent number roster. Running
            # it hourly would spend shared vendor rate budget for no new data.
            { [ "${H}" -eq 6 ] || [ "${H}" -eq 18 ]; } && ROUTES="${ROUTES} /api/cron/sync-sms-numbers"
            # 0 13 * * *
            [ "${H}" -eq 13 ]                       && ROUTES="${ROUTES} /api/cron/sweep-stale-sent-app"
          fi

          if [ "${H}" -eq 13 ]; then
            # 10 13 * * *
            [ "${M}" -ge 10 ] && [ "${M}" -lt 15 ] && ROUTES="${ROUTES} /api/cron/kixie-compliance-scan"
            # 15 13 * * *
            [ "${M}" -ge 15 ] && [ "${M}" -lt 20 ] && ROUTES="${ROUTES} /api/cron/renewal-thresholds"
            # 40 13 * * 1 — the weekly scorecard. A distinct registration, not a
            # duplicate of the daily scan: dropping the query string skips the
            # weekly code path entirely.
            [ "${DOW}" -eq 1 ] && [ "${M}" -ge 40 ] && [ "${M}" -lt 45 ] && ROUTES="${ROUTES} /api/cron/kixie-compliance-scan?mode=weekly"
          fi
          # `set -e` is deliberately NOT in effect for these tests: a false
          # condition on the last line of the block would exit the step with a
          # non-zero status and skip the dispatch entirely.
          true

          FAILED=0
          for path in ${ROUTES}; do
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -m 120 \
                     -X POST "${BASE}${path}" \
                     -H "Authorization: Bearer ${SECRET}") || code="000"
            body=$(head -c 400 /tmp/out.json 2>/dev/null | tr -d '\n')
            echo "${path} -> ${code} ${body}"
            case "${code}" in
              2*) ;;
              # A cron that silently 401s or 500s is exactly how the last outage
              # stayed invisible for four days. Fail loudly here instead.
              *) echo "::error::${path} returned ${code}"; FAILED=1 ;;
            esac
          done
          exit ${FAILED}
