# Manual rollback driver for the Cloudflare cron routes.
#
# WHY THIS EXISTS. Vercel's own scheduler stopped executing for this project on
# 2026-08-06. Everything that could explain it was checked and ruled out: the
# crons are registered in the deployment, enabled with disabledAt null, pinned
# to the CURRENT production deployment, CRON_SECRET is present on production,
# the routes are reachable and correctly reject unauthenticated callers, there
# is no deployment protection, and the team is on an active Pro plan with no
# billing block. The engine itself is fine — driven by hand it claimed and
# processed 12 rows in 3 seconds.
#
# So the fault was the scheduler alone, and this replaced it until the
# oasis-cc-cron Worker passed its live cutover gate on 2026-08-31.
#
# The cost of the outage: the dispatcher had not claimed a row in four days and
# 230 steps sat overdue while everything reported healthy.
#
# Keep workflow_dispatch as the manual rollback path. Do not restore scheduled
# triggers while the Worker is forwarding or every due job fires twice.

# ── CUTOVER PAIRING (2026-08-30, Cloudflare migration) ────────────────────────
# THIS FILE IS MANUAL-ONLY. vercel.json's `crons` block is INERT and the
# oasis-cc-cron Worker is the active firer for the registered routes.
#
# The replacement is the `oasis-cc-cron` Cloudflare Worker
# (workers/oasis-cc-cron), live with CRON_FORWARD=on. Re-arming schedules here
# without first turning CRON_FORWARD off makes every job fire twice.
# Full choreography + rollback: Business-Empire-Agent
# brain/WAVE3_OASIS_CC_RUNBOOK.md (Phase C).
# ──────────────────────────────────────────────────────────────────────────────
name: cron-driver

# The historical schedule-to-route map remains below for rollback review. A
# manual dispatch drives only the fast paths plus health-check.
#
# The wall-clock version of this was wrong. GitHub's scheduler is best-effort
# and routinely starts a run late; a 13:00 tick that lands at 13:06 failed a
# `minute < 5` window, so sweep-stale-sent-app simply did not run that day. The
# job silently skipped fixed-time work and reported success, which is the same
# class of quiet nothing this whole file exists to fix. (Codex review,
# 2026-08-11.)
#
# tests/cron-driver-coverage.test.ts pins the Worker table to the inert registry
# and asserts this workflow stays manual-only.
on:
  workflow_dispatch:

concurrency:
  # Keyed PER SCHEDULE, not one group for the whole workflow.
  #
  # A single shared group looked right and would have silently dropped work:
  # GitHub keeps at most one running and one pending run per group, and a newly
  # queued run REPLACES the pending one. Several of these schedules fire at the
  # same instant — at minute 0 of every hour, */5, */10, */15, */30 and the
  # hourly entry all land together — so under one group the later arrivals
  # would evict each other and those routes would never execute. No error, no
  # log, just absence: the exact shape of the outage this file addresses.
  # (Codex review, 2026-08-11.)
  #
  # Per-schedule groups still prevent a schedule from overlapping ITSELF, which
  # is the property actually wanted: the dispatcher leases the rows it claims so
  # a double run is survivable, but overlapping ticks waste the shared
  # TextTorrent rate budget and make the logs hard to read.
  group: cron-driver-${{ github.event.schedule || github.event_name }}
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    # 25, not 10: curl below waits up to 330s per route (matching the slowest
    # route's maxDuration=300 + margin), and the busiest tick drives 4 routes
    # sequentially — 4 x 330s = 22 min worst case. A job timeout below that
    # would kill a still-succeeding tick and report it as a driver failure.
    timeout-minutes: 25
    steps:
      - name: Drive the due cron routes
        env:
          # The apex still serves Vercel during the migration and holds an old
          # sensitive CRON_SECRET. The Cloudflare app carries the same bearer
          # as this rollback workflow; use its direct URL until DNS cutover.
          BASE: https://oasis-command-center.oasisaisolutions.workers.dev
          SECRET: ${{ secrets.OASIS_CRON_SECRET }}
          ATTEST: ${{ secrets.OASIS_CRON_ATTEST_SECRET }}
        run: |
          set -uo pipefail
          if [ -z "${SECRET}" ]; then
            echo "::error::OASIS_CRON_SECRET is not set; refusing to run blind"
            exit 1
          fi
          if [ -z "${ATTEST}" ]; then
            echo "::error::OASIS_CRON_ATTEST_SECRET is not set; refusing bearer-only cron auth"
            exit 1
          fi

          # 2026-08-11: this drove 4 of the 22 routes registered in vercel.json.
          # The other 18 had been dead since Vercel's scheduler stopped on
          # 2026-08-06 and nobody noticed, because a cron that never runs
          # produces no error — it produces nothing at all. Among the missing
          # were scan-bounces and scan-funmate-replies, the reply side of
          # shopping out.
          #
          # Routes are keyed by the SCHEDULE THAT FIRED, mirroring vercel.json
          # expression for expression, query strings included. Two earlier
          # versions of this block got that wrong in ways CI could not see:
          # bucketing by rough cadence dropped ?mode=weekly and moved
          # materialize-plans by ten hours, and reading the wall clock meant a
          # late GitHub run missed fixed-time jobs entirely.
          #
          # tests/cron-driver-coverage.test.ts pins both lists together.
          SCHEDULE="${{ github.event.schedule }}"

          # 2026-09-28, SunBiz retired (runbook C-6a): the SunBiz-only routes
          # are gone from this map as well as from the Worker table, so a
          # rollback cannot restart writes for a tenant whose data is being
          # exported and deleted. See workers/oasis-cc-cron/src/index.ts.
          case "${SCHEDULE}" in
            "*/5 * * * *")
              ROUTES="/api/cron/dispatch-drips
                      /api/cron/dispatch-scheduled-sends
                      /api/cron/dispatch-founder-meeting-reminders
                      /api/cron/sms-reply-agent
                      /api/cron/dispatch-scheduled-calls" ;;
            "*/10 * * * *")
              ROUTES="/api/cron/operator-email-agent?write=1" ;;
            "*/15 * * * *")
              # health-check is the outcome watchdog.
              # connection-health re-probes live Connections (Stripe restricted
              # keys) so a card stays green only while a live check keeps passing.
              ROUTES="/api/cron/enroll-drips
                      /api/cron/reconcile-sms
                      /api/cron/health-check
                      /api/cron/sla-check
                      /api/cron/connection-health" ;;
            "15 * * * *")    ROUTES="/api/cron/collect-cc-metrics?write=1" ;;
            "17 * * * *")    ROUTES="/api/cron/reconcile-drip-telemetry
                                      /api/cron/reconcile-website-sales-payments" ;;
            "0 3 * * *")     ROUTES="/api/cron/materialize-plans" ;;
            # The books' daily upkeep (lib/founders-finances/books-cron.ts).
            "23 21 * * *")   ROUTES="/api/cron/finance-books?job=fx-refresh" ;;
            "43 21 * * *")   ROUTES="/api/cron/finance-books?job=stripe-reconcile" ;;
            "7 22 * * *")    ROUTES="/api/cron/finance-books?job=wise-reconcile" ;;
            "29 22 * * *")   ROUTES="/api/cron/finance-books?job=wise-sync" ;;
            "")
              # Manual workflow_dispatch: drive the paths that move mail plus
              # the watchdog. Deliberately not everything — a hand-run should
              # not fire daily sweeps out of band.
              echo "manual run: driving the fast paths + health-check"
              ROUTES="/api/cron/dispatch-drips
                      /api/cron/dispatch-scheduled-sends
                      /api/cron/dispatch-founder-meeting-reminders
                      /api/cron/sms-reply-agent
                      /api/cron/dispatch-scheduled-calls
                      /api/cron/health-check" ;;
            *)
              # A schedule with no mapping means someone added a cron entry and
              # not its routes. Silence here is how the last outage happened.
              echo "::error::no routes mapped for schedule '${SCHEDULE}'"
              exit 1 ;;
          esac

          # GET, not POST. Four of the routes this driver now covers
          # (collect-cc-metrics, reconcile-drip-telemetry, tps-backlog-watch,
          # tps-enroll) export GET only, so a POST returns 405 and does no work
          # — a "driven" cron that never runs, which is the failure this file
          # exists to end. Every cron route exports GET; only some export POST.
          # GET is also what Vercel's own scheduler used. Method mismatch is
          # gone as a class rather than patched per route.
          # tests/cron-driver-coverage.test.ts asserts every driven route
          # exports GET. (Codex review, 2026-08-11.)
          FAILED=0
          for path in ${ROUTES}; do
            # -m 330 covers the slowest route's maxDuration (reconcile-sms,
            # 300s) plus network margin. At the old -m 120 a route Vercel was
            # still legally running would be reported dead by the driver.
            #
            # Truncate FIRST: on a curl failure (code 000) out.json still holds
            # the PREVIOUS route's response, and the log line then attributes
            # that stale body to the failed route — during the 2026-08-22
            # triage a reconcile-sms 000 printed enroll-accelerated's body and
            # sent diagnosis the wrong way. A failed call must show an EMPTY
            # body, because that is the truth.
            : > /tmp/out.json
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -m 330 \
                     "${BASE}${path}" \
                     -H "Authorization: Bearer ${SECRET}" \
                     -H "x-oasis-cron-attest: ${ATTEST}") || code="000"
            body=$(head -c 400 /tmp/out.json 2>/dev/null | tr -d '\n')
            echo "${path} -> ${code} ${body}"
            case "${code}" in
              2*) ;;
              # A cron that silently 401s or 500s is exactly how the last outage
              # stayed invisible for four days. Fail loudly here instead.
              *) echo "::error::${path} returned ${code}"; FAILED=1 ;;
            esac
          done
          exit ${FAILED}
